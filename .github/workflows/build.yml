name: Build Fadi APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unpack app
        run: if [ -f fadi-farm-studio.zip ]; then unzip -o -q fadi-farm-studio.zip; fi
      - name: Build APK
        run: bash android-build/build.sh
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app FadiFarm.apk --title "Fadi 5.3" --notes "آخر نسخة من تطبيق Fadi (Fadi Farm + مجرى)" --latest
