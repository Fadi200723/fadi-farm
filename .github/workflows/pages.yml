name: Publish Fadi web app (iPhone + PC) + hourly trends
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'   # تحديث الترندات كل ساعة
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app
        run: if [ -f fadi-farm-studio.zip ]; then unzip -o -q fadi-farm-studio.zip; fi
      - name: Mirror trends feeds (iPhone + PC)
        run: python3 tools/mirror_trends.py web || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
